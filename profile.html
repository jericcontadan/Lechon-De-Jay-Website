<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile | Lechon De Jay</title>
  <meta name="description" content="Your Lechon De Jay account details.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="profile">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header and footer are filled in by script.js so they are the same on every page -->
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="container">
    <h1 class="page-title">My Profile</h1>
    <div class="two-col">
      <form class="form-box" id="profileForm" novalidate>
        <label>Full name <input name="name" type="text" autocomplete="name" required></label>
        <label>Mobile number <input name="mobile" type="tel" autocomplete="tel" required></label>
        <label>Email (cannot be changed) <input name="email" type="email" readonly></label>
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <p class="form-status" id="profileStatus" role="status"></p>
      </form>
      <div class="info-box" id="profileStats"></div>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <div id="toastHost" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
