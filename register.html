<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Lechon De Jay</title>
  <meta name="description" content="Create a Lechon De Jay customer account.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="register">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header and footer are filled in by script.js so they are the same on every page -->
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="container">
    <div class="auth-box">
      <h1 class="page-title">Create Account</h1>
      <form class="form-box" id="registerForm" novalidate>
        <label>Full name <input name="name" type="text" autocomplete="name" required></label>
        <label>Mobile number <input name="mobile" type="tel" autocomplete="tel" placeholder="09XXXXXXXXX" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password (8 or more characters, with a letter and a number) <input name="password" type="password" autocomplete="new-password" required></label>
        <label>Confirm password <input name="confirm" type="password" autocomplete="new-password" required></label>
        <label class="check"><input name="consent" type="checkbox"> I agree that Lechon De Jay may keep my name, mobile number and email to process my orders (Data Privacy Act of 2012, RA 10173).</label>
        <button class="btn btn-primary" type="submit">Create Account</button>
        <p class="form-status" id="registerStatus" role="status"></p>
      </form>
      <p>Already have an account? <a href="login.html">Log in</a></p>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <div id="toastHost" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
