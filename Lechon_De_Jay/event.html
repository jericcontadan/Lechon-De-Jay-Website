<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Event Booking | Lechon De Jay</title>
  <meta name="description" content="Book Lechon De Jay for your birthday, wedding, fiesta or office event.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="event">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header and footer are filled in by script.js so they are the same on every page -->
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="container">
    <h1 class="page-title">Book an Event</h1>
    <p id="eventRules" class="note"></p>
    <form class="form-box" id="eventForm" novalidate>
      <div class="form-row">
        <label>Event type
          <select name="eventType" required>
            <option value="">Choose one</option>
            <option>Birthday</option><option>Wedding</option><option>Baptism</option>
            <option>Fiesta</option><option>Office event</option><option>Other</option>
          </select>
        </label>
        <label>Number of guests <input type="number" name="guests" min="10" max="500" required></label>
      </div>
      <div class="form-row">
        <label>Event date <input type="date" name="date" required></label>
        <label>Pickup or service time <select name="time" required></select></label>
      </div>
      <label>Lechon size <select name="size"></select></label>
      <label>Extra dishes you want (optional) <textarea name="extra" rows="2" maxlength="300"></textarea></label>
      <label>Notes (optional) <textarea name="notes" rows="2" maxlength="300"></textarea></label>
      <fieldset>
        <legend>Pay the deposit by</legend>
        <label class="check"><input type="radio" name="pay" value="GCash" checked> GCash</label>
        <label class="check"><input type="radio" name="pay" value="Maya"> Maya</label>
      </fieldset>
      <div class="summary" id="eventSummary" aria-live="polite"></div>
      <p class="privacy">Staff will confirm or suggest another date. Online payment is simulated for this school project.</p>
      <button class="btn btn-primary" type="submit">Send Booking Request</button>
    </form>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <div id="toastHost" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
