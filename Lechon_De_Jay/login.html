<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | Lechon De Jay</title>
  <meta name="description" content="Log in to order, reserve and track your orders.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="login">
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- Header and footer are filled in by script.js so they are the same on every page -->
  <header class="site-header" id="siteHeader"></header>

  <main id="main" class="container">
    <div class="auth-box">
      <h1 class="page-title">Log In</h1>
      <form class="form-box" id="loginForm" novalidate>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
        <button class="btn btn-primary" type="submit">Log In</button>
        <p class="form-status" id="loginStatus" role="status"></p>
      </form>
      <p>New here? <a href="register.html">Create an account</a></p>
      <details class="demo-box">
        <summary>Demo accounts for the class demo</summary>
        <p>Admin: <code>admin@lechondejay.test</code> / <code>admin123</code></p>
        <p>Staff: <code>staff@lechondejay.test</code> / <code>staff123</code></p>
        <p>Customer: <code>customer@lechondejay.test</code> / <code>customer123</code></p>
      </details>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>
  <div id="toastHost" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
